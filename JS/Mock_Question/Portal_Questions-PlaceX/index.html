<body>



    <script>
        let arr = [2, 7, 11, 3]
        let target = 9

        function giveIndex(nums, target) {
            for (let i = 0; i < nums.length; i++) {

                for (let j = i + 1; j < nums.length; j++) {
                    if (nums[i] + nums[j] === target) {
                        return [i, j]
                    }
                }

            }
        }

        let result = giveIndex(arr, target)
        console.log(`The indices of the two Numbers are : ${result}`)
    </script>
</body>
