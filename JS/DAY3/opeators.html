<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
</head>

<body>

    <script>
        let num1 = 10;
        let num2 = 20;
        let result = 0;

        // addtion
        result += (num1 + num2);
        console.log("Adddtion :", result)

        // subtraction

        result += (num2 - num1);
        console.log("Subtraction:", result)

        // multiplication
        result += (num1 * num2);
        console.log('multiplication :', result);

        // divide 
        result += num2 / num1;
        console.log("Division", result)


        // modulus
        let mod = num2 % num1;
        console.log("Modulus :", mod)
    </script>
</body>

</html>
