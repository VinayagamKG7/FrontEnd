<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-1</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .box {
            background-color: red;
            width: 400px;
            height: 400px;
            text-align: center;
            color: white;
            font-weight: bold;
            font-family: Georgia, 'Times New Roman', Times, serif;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
            padding: 20px;

        }

        .heading {
            text-align: center;
            background-color: black;
            color: white;
            padding: 20px;

        }

        .box img {
            width: 100%;
            margin-top: 20px;
            border-radius: 10px;
            height: 80%;
        }
    </style>
</head>

<body>
    <h1 class="heading">Box Demo</h1> <br>
    <hr>
    <div class="box">
        <h1>Birds</h1>
        <img src="../../assests/images/birds.jpeg" alt="bird image">
    </div>
</body>

</html>
