<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-2</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            background-image: url('../../assests/images/bc3.jfif');
        }
        .parent {
            background-color: cadetblue;
            height: 250px;
            margin: 20px;
            padding: 45px 0px 0px 0px;
            box-shadow: rgba(0, 0, 0, 0.16) 0px 1px 4px, rgb(51, 51, 51) 0px 0px 0px 3px;
            border-radius: 10px;    
        }

        .child {
            width: 400px;
            margin: 0 auto;
            padding: 10px;
            background-color: greenyellow;
            text-align: center;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.16) 0px 1px 4px, rgb(51, 51, 51) 0px 0px 0px 3px;
        }

        .para1+p {
            background-color: black;
            color: white;
            padding: 5px;
            margin-top: 10px;
        }

        h1+p {
            border: 2px solid red;
        }

        #heading {
            background-color: black;
            color: whitesmoke;
            text-align: center;
            padding:20px;
        }
    </style>
</head>

<body>
    <h1 id="heading">Nested Box </h1>
    <div class="parent">
        <div class="child">
            <h1>Hello</h1>
            <p class="para1">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Officiis, pariatur.</p>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Optio, error!</p>
        </div>
    </div>

</body>

</html>
