<!DOCTYPE html>
<html>

<head>
<title>Task_4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .box {
            overflow: hidden;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
        }

        .box img {
            width: 100%;
            transition: 0.5s;
            margin-top:10px;
        }

        .box::before {
            content: "IMAGE";
            background: rgb(0, 0, 0);
            color: white;
            padding:5px;
            font-size: 22px;
            transition: 0.5s;
            display: block;
            text-align: center;

        }

        .box:hover img {
            transform: scale(1.1);
        }

    </style>

</head>

<body>
    <h1 style="text-align: center;"">Image gallery</h1>
    <div class="gallery">

        <div class="box">
            <img src="https://picsum.photos/300/200?1">
        </div>
