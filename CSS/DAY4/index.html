<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexBox</title>

    <style>
        * {
            padding: 0;
            margin: 0;
        }

        .parent{
            display: flex;
            height: 400px;
            justify-content: center;
            gap:30px;
            align-items: center;
            margin: 10px;
            background-color: red;
            border-radius: 10px;

        }
        .child{
            background-color: white;
            color:black;
            height: 200px;
            flex-basis: 200px;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>

<body>
    <section>
        <h1 style="text-align: center;background-color: black;color: white;padding: 10px;margin: 10px;">Flex Box Tutorial</h1>
        <div class="parent">
            <div class="child"><p>This is child</p></div>
            <div class="child"><p>This is child</p></div>
            <div class="child"><p>This is child</p></div>
        </div>
    </section>
</body>

</html>
