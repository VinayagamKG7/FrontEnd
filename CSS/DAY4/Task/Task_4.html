<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            background-color: lightgray;
            padding: 20px;
        }


        .box {
            width: 200px;
            height: 200px;
            background-color: steelblue;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        }

        .box img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }
        .box:hover{
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Image Gallery</h1>

    <div class="gallery">

        <div class="box"><img src="../../assests/images/Crypto-part.png" alt="image"></div>
        <div class="box"><img src="../../assests/images/Forex.png" alt=""></div>
        <div class="box"><img src="../../assests/images/Indices.png" alt=""></div>
        <div class="box"><img src="../../assests/images/industry.jpg" alt=""></div>
        <div class="box"><img src="../../assests/images/Original Result.png" alt=""></div>
        <div class="box"><img src="../../assests/images/Stocks-graph.png" alt=""></div>
        <div class="box"><img src="../../assests/images/Stocks.png" alt=""></div>
        <div class="box"><img src="../../assests/images/Original Result.png" alt=""></div>
        <div class="box"><img src="../../assests/images/industry.jpg" alt=""></div>
        <div class="box"><img src="../../assests/images/industry.jpg" alt=""></div>

    </div>

</body>

</html>
