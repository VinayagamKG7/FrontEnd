<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            padding: 0;
            margin: 0;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }


        .container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            gap: 20px;
            background-color: lightgray;
            height: 200px;
            border: 2px solid black;
        }



        .box {
            width: 120px;
            height: 120px;
            background-color: steelblue;
            color: white;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <h1>Flexbox Horizontal Boxes</h1>

    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
</body>

</html>
