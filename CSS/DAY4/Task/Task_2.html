<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main_container">
        <h1>Cutting Edge solutions to power up your business</h1>

        <div class="flex_container">

            <div class="box">
                <img src="../../assests/images/industry.jpg" alt="industry-image">
                <h3>Industries</h3>
                <p>Select your industry. Discover our impact.</p>
            </div>

            <div class="box">
                <img src="../../assests/images/services.jpg" alt="serices-image">
                <h3>Serivces</h3>
                <p>Experience our services. Transform your business.</p>
            </div>

            <div class="box">
                <img src="../../assests/images/platforms.jpg" alt="platform-image">
                <h3>Products and Platforms</h3>
                <p>Explore our products. Accelerate your performance.<p>
            </div>

        </div>
    </div>
</body>
</html>
