<html>
    <head>
        <title>Flex</title>

        <style>
            *{
                padding:0;
                margin:0;
            }
            .parent{
                width:1000px;
                background-color: blanchedalmond;
                display: flex;
                gap:1px;
            }
            .child{
                background-color: black;
                flex:1 200px;
                height:100px;
            }
            .child3{
                flex:2 200px;
                height:100px;
                background-color: black;
            }
        </style>
    </head>

    <body>
        <div class="parent">
            <div class="child"></div>
            <div class="child"></div>
            <div class="child3"></div>
        </div>
    </body>
</html>
