<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            width: 400px;
            margin: 20px auto;
            background-color: burlywood;
            display: flex;
        }

        .child1 {
            padding: 5px;
            background-color: blue;
            color: white;
            flex-basis: 150px;
        }

        .child2 {
            padding: 5px;
            background-color: blueviolet;
            color: white;
            flex-basis: 150px;
        }

        .child3 {
            padding: 5px;
            background-color: brown;
            color: white;
            flex-basis: 150px;
        }

        .child4 {
            padding: 5px;
            background-color: aqua;
            color: white;
            flex-basis: 150px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="child1">1</div>
        <div class="child2">2</div>
        <div class="child3">3</div>
        <div class="child4">4</div>
    </div>
</body>

</html>
