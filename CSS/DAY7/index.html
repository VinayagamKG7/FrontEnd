<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoftLogic Systems</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 style="text-align: center;margin-top:15px;">Grid Demo</h1>
    <section style="margin-top: 20px;">
        <div class="parent">
            <h2><strong>Thumbnail</strong></h2> <hr>

            <div class="grid_container">
                <div class="img">
                    <img src="../assests/images/SLA.webp" alt="">
                </div>

                <div class="desc">
                    <p><strong>Note:</strong>This image title will be used to represent this course across all your
                        academy's landing pages.</p>
                    <p class="text">Allowed formats: ".jpg ,.png,.jpeg,.gif,.webp,.sketch"</p>
                    <p class="text">preferred minimum resolution: 480*270</p>
                    <p class="text">Maximum size:150kb</p>
                    <div>
                        <button class="desc_change">Change Image</button>
                        <button class="desc_remove">Remove Image</button>
                    </div>
                </div>
            </div>

        </div>
    </section>
</body>

</html>
