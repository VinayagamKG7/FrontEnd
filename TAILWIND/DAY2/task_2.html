<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Admin Dashboard</title>
</head>

<body class="bg-sky-50">

    <div class="flex min-h-screen">

        <!-- Sidebar -->
        <aside class="w-64 bg-indigo-900 text-white p-6">
            <h2 class="text-2xl font-bold mb-8">Admin Panel</h2>

            <ul class="space-y-4">
                <li><a href="#" class="hover:text-cyan-300">Dashboard</a></li>
                <li><a href="#" class="hover:text-cyan-300">Users</a></li>
                <li><a href="#" class="hover:text-cyan-300">Courses</a></li>
                <li><a href="#" class="hover:text-cyan-300">Reports</a></li>
                <li><a href="#" class="hover:text-cyan-300">Settings</a></li>
            </ul>
        </aside>

        <main class="flex-1 p-8">

            <h1 class="text-3xl font-bold mb-6">
                Dashboard
            </h1>

           
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">

                <div class="bg-blue-100 p-6 rounded-lg shadow">
                    <h3 class="text-blue-700">Users</h3>
                    <p class="text-3xl font-bold">2,850</p>
                </div>

                <div class="bg-green-100 p-6 rounded-lg shadow">
                    <h3 class="text-green-700">Courses</h3>
                    <p class="text-3xl font-bold">72</p>
                </div>

                <div class="bg-yellow-100 p-6 rounded-lg shadow">
                    <h3 class="text-yellow-700">Enrollments</h3>
                    <p class="text-3xl font-bold">5,680</p>
                </div>

                <div class="bg-pink-100 p-6 rounded-lg shadow">
                    <h3 class="text-pink-700">Revenue</h3>
                    <p class="text-3xl font-bold">₹1,45,000</p>
                </div>

            </div>


            <div class="bg-white p-6 rounded-lg shadow">

                <h2 class="text-2xl font-semibold mb-4">
                    Recent Users
                </h2>

                <table class="w-full border-collapse">

                    <thead>
                        <tr class="bg-indigo-200">
                            <th class="p-3 text-left">Name</th>
                            <th class="p-3 text-left">Email</th>
                            <th class="p-3 text-left">Role</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr class="border-b">
                            <td class="p-3">Karthik Raj</td>
                            <td class="p-3">karthik@gmail.com</td>
                            <td class="p-3">Student</td>
                        </tr>

                        <tr class="border-b">
                            <td class="p-3">Ananya Iyer</td>
                            <td class="p-3">ananya@gmail.com</td>
                            <td class="p-3">Trainer</td>
                        </tr>

                        <tr>
                            <td class="p-3">Vignesh Kumar</td>
                            <td class="p-3">vignesh@gmail.com</td>
                            <td class="p-3">Student</td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </main>

    </div>

</body>

</html>
