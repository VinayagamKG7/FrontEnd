<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenLeaf Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-green-50">

    <!-- Navbar -->
    <nav class="bg-green-700 text-white">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center p-4 gap-4">

            <h1 class="text-3xl font-bold">
                GreenLeaf Market
            </h1>

            <!-- Search -->
            <input type="text" placeholder="Search plants..." class="px-4 py-2 rounded text-black w-full md:w-80">

            <!-- Cart -->
            <button class="bg-white text-green-700 px-4 py-2 rounded font-semibold">
                Cart (2)
            </button>

        </div>
    </nav>

    <!-- Category Dropdown -->
    <section class="container mx-auto px-4 py-6">

        <div class="flex justify-end">
            <select class="border p-2 rounded">
                <option>All Plants</option>
                <option>Indoor Plants</option>
                <option>Outdoor Plants</option>
                <option>Flowering Plants</option>
                <option>Succulents</option>
            </select>
        </div>

    </section>

    <!-- Product Section -->
    <section class="container mx-auto px-4 pb-10">

        <h2 class="text-4xl font-bold text-center text-green-800 mb-10">
            Featured Plants
        </h2>

        <!-- Responsive Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

            <!-- Product 1 -->
            <div class="bg-white rounded-xl shadow hover:shadow-xl overflow-hidden">

                <div class="overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1545239351-1141bd82e8a6?w=500"
                        class="w-full h-56 object-cover hover:scale-110 transition duration-300">
                </div>

                <div class="p-4">
                    <h3 class="text-xl font-bold">Snake Plant</h3>
                    <p class="text-green-700 font-semibold">₹499</p>
                    <p class="text-yellow-500">★★★★★</p>

                    <button class="mt-3 w-full bg-green-700 text-white py-2 rounded">
                        Add To Cart
                    </button>
                </div>

            </div>

            <!-- Product 2 -->
            <div class="bg-white rounded-xl shadow hover:shadow-xl overflow-hidden">

                <div class="overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?w=500"
                        class="w-full h-56 object-cover hover:scale-110 transition duration-300">
                </div>

                <div class="p-4">
                    <h3 class="text-xl font-bold">Peace Lily</h3>
                    <p class="text-green-700 font-semibold">₹699</p>
                    <p class="text-yellow-500">★★★★☆</p>

                    <button class="mt-3 w-full bg-green-700 text-white py-2 rounded">
                        Add To Cart
                    </button>
                </div>

            </div>

            <!-- Product 3 -->
            <div class="bg-white rounded-xl shadow hover:shadow-xl overflow-hidden">

                <div class="overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1512428813834-c702c7702b78?w=500"
                        class="w-full h-56 object-cover hover:scale-110 transition duration-300">
                </div>

                <div class="p-4">
                    <h3 class="text-xl font-bold">Aloe Vera</h3>
                    <p class="text-green-700 font-semibold">₹399</p>
                    <p class="text-yellow-500">★★★★★</p>

                    <button class="mt-3 w-full bg-green-700 text-white py-2 rounded">
                        Add To Cart
                    </button>
                </div>

            </div>

            <!-- Product 4 -->
            <div class="bg-white rounded-xl shadow hover:shadow-xl overflow-hidden">

                <div class="overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=500"
                        class="w-full h-56 object-cover hover:scale-110 transition duration-300">
                </div>

                <div class="p-4">
                    <h3 class="text-xl font-bold">Money Plant</h3>
                    <p class="text-green-700 font-semibold">₹599</p>
                    <p class="text-yellow-500">★★★★☆</p>

                    <button class="mt-3 w-full bg-green-700 text-white py-2 rounded">
                        Add To Cart
                    </button>
                </div>

            </div>

            <!-- Product 5 -->
            <div class="bg-white rounded-xl shadow hover:shadow-xl overflow-hidden">

                <div class="overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1463154545680-d59320fd685d?w=500"
                        class="w-full h-56 object-cover hover:scale-110 transition duration-300">
                </div>

                <div class="p-4">
                    <h3 class="text-xl font-bold">Rose Plant</h3>
                    <p class="text-green-700 font-semibold">₹799</p>
                    <p class="text-yellow-500">★★★★★</p>

                    <button class="mt-3 w-full bg-green-700 text-white py-2 rounded">
                        Add To Cart
                    </button>
                </div>

            </div>

            <!-- Product 6 -->
            <div class="bg-white rounded-xl shadow hover:shadow-xl overflow-hidden">

                <div class="overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=500"
                        class="w-full h-56 object-cover hover:scale-110 transition duration-300">
                </div>

                <div class="p-4">
                    <h3 class="text-xl font-bold">Lavender Plant</h3>
                    <p class="text-green-700 font-semibold">₹899</p>
                    <p class="text-yellow-500">★★★★★</p>

                    <button class="mt-3 w-full bg-green-700 text-white py-2 rounded">
                        Add To Cart
                    </button>
                </div>

            </div>

            <!-- Product 7 -->
            <div class="bg-white rounded-xl shadow hover:shadow-xl overflow-hidden">

                <div class="overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1459156212016-c812468e2115?w=500"
                        class="w-full h-56 object-cover hover:scale-110 transition duration-300">
                </div>

                <div class="p-4">
                    <h3 class="text-xl font-bold">Cactus Plant</h3>
                    <p class="text-green-700 font-semibold">₹349</p>
                    <p class="text-yellow-500">★★★★☆</p>

                    <button class="mt-3 w-full bg-green-700 text-white py-2 rounded">
                        Add To Cart
                    </button>
                </div>

            </div>

            <!-- Product 8 -->
            <div class="bg-white rounded-xl shadow hover:shadow-xl overflow-hidden">

                <div class="overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1463936575829-25148e1db1b8?w=500"
                        class="w-full h-56 object-cover hover:scale-110 transition duration-300">
                </div>

                <div class="p-4">
                    <h3 class="text-xl font-bold">Jade Plant</h3>
                    <p class="text-green-700 font-semibold">₹549</p>
                    <p class="text-yellow-500">★★★★★</p>

                    <button class="mt-3 w-full bg-green-700 text-white py-2 rounded">
                        Add To Cart
                    </button>
                </div>

            </div>

        </div>

    </section>

</body>

</html>
